name: Cleanup old Actions

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep latest 5 successful runs and delete older completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: $REPO"
          echo "Preserving the latest 5 successful runs."
          tmp_runs=$(mktemp)
          tmp_keep=$(mktemp)
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, (.conclusion // ""), .created_at, .name, .display_title] | @tsv' \
            > "$tmp_runs"
          awk -F '\t' '$2 == "completed" && $3 == "success" {print $1}' "$tmp_runs" | head -n 5 > "$tmp_keep"
          deleted=0
          while IFS=$'\t' read -r run_id status conclusion created_at run_name display_title; do
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ "$status" != "completed" ]] && continue
            grep -Fxq "$run_id" "$tmp_keep" && continue
            echo "Deleting completed run $run_id | $conclusion | $created_at | $run_name | $display_title"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$REPO/actions/runs/$run_id"
            deleted=$((deleted + 1))
          done < "$tmp_runs"
          echo "Cleanup completed. Deleted $deleted completed runs; latest 5 successful runs were preserved."
